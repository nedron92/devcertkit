## Run OpenVPN with reduced privileges ##
user openvpn
group openvpn

## Listen on IPv4 / TCP / fallback port ##
proto tcp-server
port __VPN_PORT_FALLBACK__
dev tun1

## Basic hardening / stability ##
persist-key
persist-tun
topology subnet
keepalive 10 120
auth SHA256

## VPN subnet + persistent client IP mapping ##
server 10.10.2.0 255.255.255.0
ifconfig-pool-persist /etc/openvpn/client-ips-fast.txt

## PKI / certificates ##
ca   /etc/openvpn/server/ca.crt
cert /etc/openvpn/server/server.crt
key  /etc/openvpn/server/server.key

## Modern TLS group handling ##
dh none
tls-groups X25519:prime256v1:secp384r1

## TLS protection ##
tls-crypt /etc/openvpn/server/ta.key

## Minimum TLS version ##
tls-version-min 1.2

## Data channel ciphers ##
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
data-ciphers-fallback AES-128-GCM

## DNS for clients ##
push "dhcp-option DNS 10.10.2.1"

## Force full-tunnel for fallback clients ##
push "redirect-gateway def1 bypass-dhcp"
push "block-outside-dns"

## Client-to-client communication ##
client-to-client

## TCP transport tuning ##
tcp-nodelay
push "socket-flags TCP_NODELAY"

## Socket buffers ##
sndbuf 0
rcvbuf 0
push "sndbuf 0"
push "rcvbuf 0"

## Queue length ##
txqueuelen 1000

## Certificate revocation list ##
#crl-verify /etc/openvpn/server/crl.pem

## Logging ##
verb 3
status /etc/openvpn/openvpn-status-tcp.log
log-append /var/log/openvpn/server-tcp.log
